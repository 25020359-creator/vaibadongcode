name: Java CI/CD Automation with Maven

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    # 1. Định nghĩa chiến lược Matrix chạy đa hệ điều hành
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    
    # 2. Sử dụng biến matrix để kích hoạt hệ điều hành tương ứng
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'oracle'
          cache: maven

      - name: Build and Verify with Maven (Includes JaCoCo)
        run: mvn clean verify
            
            # Nhiệm vụ 4: Lưu giữ tệp báo cáo bao phủ dưới dạng Artifact
          - name: Upload JaCoCo Code Coverage Report
            if: always() # Giữ bước này luôn chạy kể cả khi build thành công hay thất bại để xem lỗi
            uses: actions/upload-artifact@v4
            with:
              name: Code-Coverage-Report
              path: target/site/jacoco/