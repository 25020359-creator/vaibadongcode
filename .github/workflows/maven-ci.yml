name: Java CI/CD Automation with Maven

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    # 1. Định nghĩa chiến lược Matrix chạy đa hệ điều hành
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    
    # 2. Sử dụng biến matrix để kích hoạt hệ điều hành tương ứng
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'oracle'
          cache: maven

      - name: Build with Maven
        run: mvn clean package

      # Chỉ upload artifact từ máy ảo ubuntu để tránh trùng lặp file tải lên
      - name: Upload Build Artifact (JAR File)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: Week9-Executable-JAR
          path: target/*.jar